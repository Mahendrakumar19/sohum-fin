<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 50" width="190" height="50">
  <!-- Official ICICI Flame Crest in Orange & Maroon with White 'i' -->
  <g transform="translate(6, 5)">
    <!-- Orange Outer Glow / Arc -->
    <ellipse cx="20" cy="20" rx="19" ry="19" fill="#f58220" />
    <!-- Deep Maroon Crest Inner -->
    <path d="M7 24C8 12 18 3 29 4c6 0 10 4 10 9 0 9-9 22-22 26-6 2-10-1-10-6v-9z" fill="#a81c20" />
    <!-- White 'i' symbol inside crest -->
    <circle cx="21" cy="11.5" r="3.2" fill="#ffffff" />
    <path d="M18.5 18.5h5v15h-5z" fill="#ffffff" />
  </g>
  <!-- Official ICICI Bank Dual-Color Typography -->
  <text x="56" y="32" fill="#a81c20" font-size="22" font-weight="900" font-family="'Plus Jakarta Sans', Arial, sans-serif" letter-spacing="-0.3">
    ICICI <tspan fill="#f58220">Bank</tspan>
  </text>
</svg>